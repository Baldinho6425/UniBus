name: unibus
description: "UniBus - Organize o transporte universitário: confirme presença, acompanhe viagens e gerencie passageiros."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  provider: ^6.1.2

  # Navegação (funciona igual em mobile e desktop)
  go_router: ^14.2.0

  # Firebase (auth + banco em tempo real + notificações)
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0

  # Utilidades
  intl: ^0.19.0

  # Gráficos (Painel Administrativo)
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
